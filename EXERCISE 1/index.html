<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Counter</h1>
    <h2 id="count">0</h2>

    <div>
        <label for="step-config">Step: </label>

       <input type="number" id="step-input" value="1" min="1"></input>
    </div>

    <div class="buttons">
    <button id="decrease" class="button">-</button>
    <button id="increase" class="button">+</button>
    <button id="reset" class="button">Reset</button>
    <button id="double" class ="button">Double</button>
</div>
    <script src="script.js"></script>
</body>
</html>
