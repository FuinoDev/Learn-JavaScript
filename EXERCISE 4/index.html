<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div id="error-message">
        <span id="error-text"></span>
        <button id="exit-message" type="button">X</button>
    </div>
    <div class="container">
        <h1>Expense Tracker</h1>
<div class="input-container">
        <label for="expenseNameInput">Expense Name:</label>
     <input type="text" placeholder="Expense name" id="expenseNameInput">
</div>

<div class="input-container">
        <label for="expenseInput">Expense Amount:</label>
       <input type="number"  placeholder="Enter expense amount"  id="expenseInput" min="0" step="0.01">
</div>

<div class="input-container">
    <label for="categoryInput">Category:</label>
    <select id="categoryInput">
        <option value="Food">Food</option>
        <option value="Transportation">Transportation</option>
        <option value="Games">Games</option>
    </select>

    <button id="addExpenseButton">Add Expense</button>
</div>
  <ul id="expenseList"></ul>
         <p>Total Expenses: ₱<span id="totalExpenses">0.00</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
