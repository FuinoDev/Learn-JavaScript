<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Grade Manager</h1>
        <p class="subtitle">Manage student grades and calculate results.</p>

        <!-- Input Section -->
        <div class="form-container">

            <div class="input-group">
                <label for="studentNameInput">Student Name</label>
                <input
                    type="text"
                    id="studentNameInput"
                    placeholder="Enter student name"
                >
            </div>

            <div class="input-group">
                <label for="gradeInput">Grade</label>
                <input
                    type="number"
                    id="gradeInput"
                    placeholder="Enter grade"
                    min="0"
                    max="100"
                >
            </div>

            <button id="addStudentButton">
                Add Student
            </button>

        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message">
            <span id="errorText"></span>
            <button id="closeErrorButton">&times;</button>
        </div>

        <!-- Student List -->
        <section class="student-section">

            <div class="section-header">
                <h2>Students</h2>
                <span id="studentCount">0 Students</span>
            </div>

            <div id="studentList" class="student-list">
                <p class="empty-message">
                    No students added yet.
                </p>
            </div>

        </section>

        <!-- Summary -->
        <section class="summary">

            <h2>Summary</h2>

            <div class="summary-item">
                <span>Total Students</span>
                <strong id="totalStudents">0</strong>
            </div>

            <div class="summary-item">
                <span>Average Grade</span>
                <strong id="averageGrade">0.00</strong>
            </div>

            <div class="summary-item">
                <span>Highest Grade</span>
                <strong id="highestGrade">0.00</strong>
            </div>

            <div class="summary-item">
                <span>Lowest Grade</span>
                <strong id="lowestGrade">0.00</strong>
            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
