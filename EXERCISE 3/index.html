<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 3 - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <div class="input-container">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >
            <button id="addButton">
                Add Task
            </button>
        </div>
        <p id="taskCount">
            0 tasks remaining
        </p>
        <ul id="taskList"></ul>
    </main>
    <script src="script.js"></script>

</body>
</html>
