<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<div class="container">
<h1>Simple Shopping Cart</h1>

    <div class="inputContainer">
      <label>Product Name: </label>
      <input id="productNameInput" type="text" placeholder="Name of the product. . .">
    </div>
    <div class="inputContainer">
      <label>Price: </label>
      <input id="priceInput" type="number" placeholder="Name of the product. . ." min="0" ste="0.1">
    </div>
    <div class="inputContainer">
      <label>Quantity: </label>
      <input id="quantityInput" type="text" placeholder="Name of the product. . .">
    </div>

</div>

<body>
    <script src="script.js"></script>
</body>
</html>
