<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div id="error-message">
        <span id="error-text"></span>
        <button id="exit-message" type="button">X</button>
    </div>
    
<div class="container">
<h1>Simple Shopping Cart</h1>

    <div class="inputContainer">
      <label>Product Name: </label>
      <input id="productNameInput" type="text" placeholder="Name of the product. . .">
    </div>
    <div class="inputContainer">
      <label>Price: </label>
      <input id="priceInput" type="number" placeholder="Price of the product. . ." min="0" step="0.1">
    </div>
    <div class="inputContainer">
      <label>Quantity: </label>
      <input id="quantityInput" type="number" placeholder="Enter the Quantity of product. . ." min="0">
    </div>
     <button id="addtocartButton">Add to Cart</button>

    <ul id="shoppingList"> </ul>
        <p>Total Items: <span id="total-items">0</span></p>
        <p>Subtotal: ₱<span id="sub-total">0.00</span></p>
</div>
    <script src="script.js"></script>
</body>
</html>
