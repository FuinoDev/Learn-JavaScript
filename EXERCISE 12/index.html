```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 12 - Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <p class="subtitle">
            Exercise 12 - Advanced JavaScript + Local Storage
        </p>


        <!-- =========================
             SUMMARY
        ========================== -->

        <div class="summary">

            <div class="summary-box">
                <span>Total Expenses</span>
                <strong id="totalExpenses">₱0.00</strong>
            </div>

            <div class="summary-box">
                <span>Number of Expenses</span>
                <strong id="expenseCount">0</strong>
            </div>

            <div class="summary-box">
                <span>Highest Expense</span>
                <strong id="highestExpense">₱0.00</strong>
            </div>

            <div class="summary-box">
                <span>Average Expense</span>
                <strong id="averageExpense">₱0.00</strong>
            </div>

        </div>


        <!-- =========================
             EXPENSE FORM
        ========================== -->

        <div class="form-container">

            <h2 id="formTitle">
                Add Expense
            </h2>

            <form id="expenseForm">

                <div class="form-group">

                    <label for="expenseName">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Enter expense name"
                    >

                </div>


                <div class="form-group">

                    <label for="expenseAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="form-group">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <select id="expenseCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transportation">
                            Transportation
                        </option>

                        <option value="School">
                            School
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="expenseDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="expenseDate"
                    >

                </div>


                <div class="button-container">

                    <button
                        type="submit"
                        id="submitButton"
                    >
                        Add Expense
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- =========================
             EXPENSE SECTION
        ========================== -->

        <div class="expense-section">

            <div class="section-header">

                <h2>Expenses</h2>

                <div class="controls">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search expense..."
                    >


                    <select id="filterCategory">

                        <option value="All">
                            All Categories
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transportation">
                            Transportation
                        </option>

                        <option value="School">
                            School
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <select id="sortExpense">

                        <option value="default">
                            Sort By
                        </option>

                        <option value="newest">
                            Newest First
                        </option>

                        <option value="oldest">
                            Oldest First
                        </option>

                        <option value="amountLow">
                            Amount Low-High
                        </option>

                        <option value="amountHigh">
                            Amount High-Low
                        </option>

                        <option value="nameAsc">
                            Name A-Z
                        </option>

                        <option value="nameDesc">
                            Name Z-A
                        </option>

                    </select>

                </div>

            </div>


            <div id="expenseList"></div>


            <p id="emptyMessage">
                No expenses found.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
