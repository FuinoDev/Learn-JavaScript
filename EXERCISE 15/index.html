<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 15 - Task Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Task Management Dashboard</h1>

        <p class="description">
            Create, manage, filter, and save your tasks.
        </p>

        <div class="summary">

            <div class="summary-card">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="summary-card">
                <span>Pending</span>
                <strong id="pendingTasks">0</strong>
            </div>

            <div class="summary-card">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>

            <div class="summary-card">
                <span>High Priority</span>
                <strong id="highPriorityTasks">0</strong>
            </div>

        </div>

        <form id="taskForm">

            <div class="input-group">

                <label for="taskName">Task Name</label>

                <input
                    type="text"
                    id="taskName"
                    placeholder="Enter task name"
                >

                <small id="taskNameError" class="input-error"></small>

            </div>

            <div class="input-group">

                <label for="taskDescription">Description</label>

                <textarea
                    id="taskDescription"
                    placeholder="Enter task description"
                ></textarea>

                <small id="taskDescriptionError" class="input-error"></small>

            </div>

            <div class="input-group">

                <label for="taskPriority">Priority</label>

                <select id="taskPriority">

                    <option value="">Select priority</option>

                    <option value="Low">Low</option>

                    <option value="Medium">Medium</option>

                    <option value="High">High</option>

                </select>

                <small id="taskPriorityError" class="input-error"></small>

            </div>

            <div class="input-group">

                <label for="taskDueDate">Due Date</label>

                <input
                    type="date"
                    id="taskDueDate"
                >

                <small id="taskDueDateError" class="input-error"></small>

            </div>

            <button type="submit" id="addTaskButton">
                Add Task
            </button>

            <button type="button" id="cancelEditButton">
                Cancel Edit
            </button>

        </form>

        <div id="message" class="message">

            <span id="messageText"></span>

            <button id="closeMessage">
                ×
            </button>

        </div>

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <select id="statusFilter">

                <option value="All">All Status</option>

                <option value="Pending">Pending</option>

                <option value="Completed">Completed</option>

            </select>

            <select id="priorityFilter">

                <option value="All">All Priority</option>

                <option value="Low">Low</option>

                <option value="Medium">Medium</option>

                <option value="High">High</option>

            </select>

            <select id="sortTasks">

                <option value="default">Default</option>

                <option value="dueDate">Due Date</option>

                <option value="priority">Priority</option>

                <option value="name">Name</option>

            </select>

        </div>

        <div id="taskList" class="task-list"></div>

        <p id="emptyMessage" class="empty-message">
            No tasks available.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
