<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9 - User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>User Dashboard</h1>

        <p class="description">
            Fetch and display users from an API
        </p>

        <div class="controls">

            <div class="search-group">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search user by name..."
                >

                <small id="searchError" class="input-error"></small>

            </div>

            <button id="loadUsersButton">
                Load Users
            </button>

            <button id="clearButton">
                Clear
            </button>

        </div>

        <div id="errorMessage" class="error-message">

            <span id="errorText"></span>

            <button id="closeErrorButton">
                &times;
            </button>

        </div>

        <div id="successMessage" class="success-message">

            <span id="successText"></span>

            <button id="closeSuccessButton">
                &times;
            </button>

        </div>

        <p class="user-count">
            Users: <span id="userCount">0</span>
        </p>

        <div id="userList">

            <p class="empty-message">
                No users loaded yet.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
