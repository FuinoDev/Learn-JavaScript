<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9 - User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>User Dashboard</h1>

        <p class="description">
            Fetch and display users from an API
        </p>

        <div class="controls">

            <button id="loadUsersButton">Load Users</button>

            <input
                type="text"
                id="searchInput"
                placeholder="Search user by name..."
            >

            <button id="clearButton">Clear</button>

        </div>

        <div id="status" class="status"></div>

        <p class="user-count">
            Users: <span id="userCount">0</span>
        </p>

        <div id="userList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
